name: Controlla affitti Pesaro

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia solo un messaggio Telegram di prova"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pesaro-affitti-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: deliverable_bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deliverable_bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Test Telegram
        if: ${{ inputs.test_telegram == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --test-telegram

      - name: Controlla nuovi annunci
        if: ${{ inputs.test_telegram != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva lo stato
        if: ${{ inputs.test_telegram != true }}
        run: |
          if git diff --quiet -- state/seen.json; then exit 0; fi
          git config user.name "pesaro-affitti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Aggiorna annunci già controllati"
          git pull --rebase
          git push
